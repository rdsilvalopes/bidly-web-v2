<!doctype html>
<html lang="pt-BR" class="preauth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bidly • Admin</title>

  <link rel="stylesheet" href="/assets/css/activation.css?v=DOCS4" />
  <link rel="stylesheet" href="/assets/css/standard-ui.css?v=1">
  <link rel="stylesheet" href="/assets/css/admin-lite.css?v=AL1" />

  <style>
    /* Anti-blink: esconde enquanto o boot decide */
    .preauth .topbar,
    .preauth #adminApp { visibility: hidden; }

    /* Largura canônica */
    :root { --container-w: min(96vw, 1380px); }

    .admin-wrap,
    #adminApp {
      max-width: var(--container-w) !important;
      margin-left: auto;
      margin-right: auto;
      padding-left: 16px;
      padding-right: 16px;
    }

    /* Estilos locais do Admin Lite */
    .admin-wrap{max-width:1200px;margin:18px auto;padding:0 16px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}
    .toolbar input,.toolbar select{height:40px;border:1px solid rgba(0,0,0,.14);border-radius:10px;padding:0 12px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px 12px;border-bottom:1px solid rgba(0,0,0,.08);text-align:left}
    th{font-size:14px;color:#475569}
    .muted{color:#6b7280}
    .right{text-align:right}
    .pill{display:inline-block;padding:.2rem .5rem;border-radius:999px;font-size:.75rem}
    .pill--success{background:#e6ffe9;color:#065f46;border:1px solid #a7f3d0}
    .pill--danger{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}
    .pill--info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
    .pill--muted{background:#f3f4f6;color:#374151;border:1px solid #e5e7eb}
    .pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px}
    .note{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px}
    .detail{margin-top:18px;display:none}
    .detail .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
    .detail .field{display:flex;flex-direction:column;gap:6px}
    .detail label{font-size:.85rem;color:#475569}
    .detail input,.detail textarea{height:40px;border:1px solid #e5e7eb;border-radius:10px;padding:8px 12px;background:#f8fafc}
    .detail input[readonly], .detail input:disabled{background:#f8fafc}
    .detail textarea{min-height:90px;resize:vertical}
  </style>
</head>

<body class="wrap has-topbar">
  <header class="topbar">
    <div class="container">
      <strong style="color:#fff">Bidly • Admin Lite</strong>
      <div class="spacer"></div>
      <a class="btn ghost" href="/admin/roles.html">Gerenciar papéis</a>
      <a class="btn ghost" href="/">Voltar ao app</a>
    </div>
  </header>

  <main class="admin-wrap">
    <section id="adminApp"></section>
  </main>

  <!-- 1) Supabase UMD -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.js"></script>

  <!-- 2) Redireciono de logout (precisa vir ANTES do supa.js) -->
  <script>window.__SUPA_LOGOUT_REDIRECT = '/admin/login.html';</script>

  <!-- 3) supa core + guards (um único fluxo de sessão para o site) -->
  <script defer src="/assets/js/supa.js?v=1"></script>
  <script defer src="/assets/js/guards.js?v=1"></script>

  <!-- utils (carregar ANTES do view.detail.js) -->
  <script src="/assets/js/utils/mask.js?v=1"></script>

  <!-- 4) Módulos do Admin (definem Bidly.admin.getCaps, Bidly.admin.mount, etc.) -->
  <script defer src="/assets/js/admin/api.js?v=AL3"></script>
  <script defer src="/assets/js/admin/caps.js?v=AL3"></script>

  <script defer src="/assets/js/admin/view.detail.js?v=AL1"></script>
  <script defer src="/assets/js/admin/view.js?v=AL12"></script>
  <script defer src="/assets/js/admin/boot.js?v=AL3"></script>


  <!-- 5) Boot: roda APÓS DOMContentLoaded (todos os defer já executaram) -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      (async () => {
        try {
          // listeners/guard de sessão (arquivo guards.js)
          await ensureAuthListeners();

          // exige sessão: se não houver, guards redireciona para /admin/login.html
          const session = await requireAuth();
          if (!session) return;

          // conecta supabase e carrega caps/roles
          const sb    = await connectSupabase();
          const uid   = session.user?.id    || null;
          const email = session.user?.email || null;

          const caps = await (window.Bidly?.admin?.getCaps
            ? window.Bidly.admin.getCaps(sb, uid, email)
            : { roles: [], caps: [] });

          // memo global (usado em view/boot)
          window.__ADMIN_ROLES = caps.roles || [];
          window.__ADMIN_CAPS  = caps.caps  || [];

          // monta painel (já definido por boot.js)
          if (window.Bidly && window.Bidly.admin && typeof window.Bidly.admin.mount === 'function') {
            await window.Bidly.admin.mount();
          } else {
            console.error('[admin] mount() não encontrado. Verifique a ordem de scripts.');
          }

          // exibe UI
          document.documentElement.classList.remove('preauth');
        } catch (err) {
          console.error('[admin boot]', err);
          // Em erro inesperado, ainda removemos o preauth pra mostrar o topo + msg de erro da tabela
          document.documentElement.classList.remove('preauth');
        }
      })();
    });
  </script>
</body>
</html>
