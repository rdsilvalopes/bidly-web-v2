<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bidly — App</title>

  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="stylesheet" href="/assets/css/activation.css" />

  <style>
    /* util mínima p/ fallback */
    .hide{display:none!important}
  </style>
</head>
<body class="wrap has-topbar">

  <!-- ========== TOPBAR FIXA ==========
       Altura controlada por --topbar-h em activation.css -->
  <header class="topbar" role="banner" aria-label="Barra superior">
    <div class="container">
      <a class="brand" href="/index.html" aria-label="Bidly">
        <span class="logo"></span><span>Bidly</span>
      </a>

      <nav class="nav-desktop" aria-label="Principal">
        <a href="/index.html#beneficios">Benefícios</a>
        <a href="/index.html#como-funciona">Como funciona</a>
        <a href="/index.html#precos">Preços</a>
        <a href="/index.html#faq">FAQ</a>
      </nav>

      <div class="actions" data-auth>
        <span class="muted">
          Logado como: <b id="userEmail">—</b>
          <span id="userRoleText"> • Perfil: —</span>
        </span>
        <button id="btnOutTop" class="btn">Sair</button>
      </div>
    </div>
  </header>

  <!-- ========== CONTEÚDO DO APP ==========
       (fica ao fundo; a folha de ativação cobre este conteúdo
       quando estiver visível) -->
  <main id="appRoot" class="container" aria-live="polite">
    <!-- Seu conteúdo normal do app -->
  </main>

  <!-- ========== FOLHA: TERMOS (tela cheia, branca) ========== -->
  <section id="termsFull" class="sheet sheet--terms hide" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Termos de uso">
    <div class="sheet__inner">
      <header class="sheet__header">
        <h2>Termos de uso</h2>
        <small>Versão <span id="termsVer">—</span></small>
      </header>


        <!-- CONTADOR -->
        <div class="act-progress">
          <span class="act-progress__text">Etapa 0/3</span>
          <div class="act-progress__bar"><div class="act-progress__fill"></div></div>
        </div>
        <!-- /CONTADOR -->



      <article id="termsBox" class="sheet__scroll" tabindex="0" aria-label="Conteúdo dos termos"></article>

      <footer class="sheet__footer">
        <label class="agree">
          <input type="checkbox" id="chkAgree" />
          <span>Li e concordo com os termos de uso.</span>
        </label>

        <div class="actions">
          <button id="btnPrintTerms" class="btn link" type="button">Salvar PDF</button>
          <span class="spacer"></span>
          <button id="btnCancelTerms" class="btn ghost" type="button">Cancelar</button>
          <button id="btnAcceptTerms" class="btn primary" type="button" disabled>Aceitar</button>
        </div>
      </footer>
    </div>
  </section>

 <!-- ========== FOLHA: DADOS DA ORGANIZAÇÃO (Empresa) ========== -->
<section id="orgFull" class="sheet sheet--org hide" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Dados da organização">
  <div class="sheet__inner">
    <header class="sheet__header">
      <h2>Dados da organização</h2>
    </header>

    <div class="sheet__scroll">
      <!-- CONTADOR -->
      <div class="act-progress">
        <span class="act-progress__text">Etapa 0/3</span>
        <div class="act-progress__bar"><div class="act-progress__fill"></div></div>
      </div>
      <!-- /CONTADOR -->

  <form id="orgForm" class="org-form" autocomplete="off">
    <div class="org__grid">
        <!-- 1) CNPJ -->
        <div class="col-6">
          <label class="label" for="org_cnpj">CNPJ</label>
          <input id="org_cnpj" class="input" placeholder="00.000.000/0001-00" inputmode="numeric" />
        </div>

        <!-- 2) Razão social -->
        <div class="col-6">
          <label class="label" for="org_name">Razão social</label>
          <input id="org_name" class="input" placeholder="Ex.: Acme Ltda" />
        </div>

        <!-- 3) Nome fantasia -->
        <div class="col-6">
          <label class="label" for="org_trade">Nome fantasia</label>
          <input id="org_trade" class="input" placeholder="Ex.: Acme" />
        </div>

        <!-- 4) Logradouro -->
        <div class="col-6">
          <label class="label" for="org_address">Logradouro</label>
          <input id="org_address" class="input" placeholder="Rua/Avenida" />
        </div>

        <!-- 5) Número -->
        <div class="col-3">
          <label class="label" for="org_number">Número</label>
          <input id="org_number" class="input" placeholder="Ex.: 123 ou 123A" />
        </div>

        <!-- 6) Complemento -->
        <div class="col-9">
          <label class="label" for="org_complement">Complemento</label>
          <input id="org_complement" class="input" placeholder="Ex.: Bloco B, Sala 402" />
        </div>

        <!-- 7) Estado (UF) -->
        <div class="col-3">
          <label class="label" for="org_uf">Estado (UF)</label>
          <input id="org_uf" class="input" placeholder="UF" maxlength="2" />
        </div>

        <!-- 8) Cidade -->
        <div class="col-9">
          <label class="label" for="org_city">Cidade</label>
          <input id="org_city" class="input" placeholder="Cidade" />
        </div>
      </div>

      <div class="sheet__footer">
        <small class="muted">Pessoa Jurídica: enviaremos para análise após o envio.</small>
        <div class="actions">
          <span class="spacer"></span>
          <button id="btnOrgCancel" class="btn ghost" type="button">Cancelar</button>
          <button class="btn primary" type="submit">Salvar</button>
        </div>
      </div>
    </form>
  </div>
</section>

  
  <!-- ========== SCRIPTS ========== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.js"></script>
  <script src="/assets/js/supa.js?v=1"></script>
  <script src="/assets/js/app.js?v=ORG13"></script>
  <script src="/assets/js/activation.js?"></script>

  <script>
    // Botões sair (topo); usam supa.js
    (async () => {
      if (!window.connectSupabase || !window.applyAuthUI) return;
      const sb = await window.connectSupabase();
      await window.applyAuthUI();

      const out = document.getElementById('btnOutTop');
      out?.addEventListener('click', async () => {
        await window.logoutLocal?.();
        window.location.href = '/index.html';
      });

      // Mostra papel no topo, se disponível
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (user) {
          const { data } = await sb.from('profiles').select('role,email').eq('id', user.id).single();
          document.getElementById('userEmail').textContent = data?.email || user.email;
          document.getElementById('userRoleText').textContent = data?.role ? ` • Perfil: ${data.role === 'company' ? 'Empresa' : 'Fornecedor'}` : '';
        }
      } catch { /* ignore */ }
    })();
  </script>
</body>
</html>
