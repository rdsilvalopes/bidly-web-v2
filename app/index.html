<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bidly — App</title>

  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="stylesheet" href="/assets/css/ui-forms.css">   <!-- utilitário, genérico -->
  <link rel="stylesheet" href="/assets/css/activation.css"> <!-- regras específicas -->

  <style>.hide{display:none!important}</style>
</head>
<body class="wrap has-topbar">

  <!-- ========== TOPBAR FIXA ========== -->
  <header class="topbar" role="banner" aria-label="Barra superior">
    <div class="container">
      <a class="brand" href="/index.html" aria-label="Bidly">
        <span class="logo"></span><span>Bidly</span>
      </a>

      <nav class="nav-desktop" aria-label="Principal">
        <a href="/index.html#beneficios">Benefícios</a>
        <a href="/index.html#como-funciona">Como funciona</a>
        <a href="/index.html#precos">Preços</a>
        <a href="/index.html#faq">FAQ</a>
      </nav>

      <div class="actions" data-auth>
        <span class="muted">
          Logado como: <b id="userEmail">—</b>
          <span id="userRoleText"> • Perfil: —</span>
        </span>
        <button id="btnOutTop" class="btn">Sair</button>
      </div>
    </div>
  </header>

  <!-- ========== CONTEÚDO DO APP (não usado no fluxo) ========== -->
  <main id="appRoot" class="container" aria-live="polite"></main>

  <!-- ========== FOLHA: TERMOS (tela cheia, branca) ========== -->
  <section id="termsFull" class="sheet sheet--terms hide" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Termos de uso">
    <div class="sheet__inner">

      <!-- Header SEM título; apenas o rótulo de etapa -->
      <header class="sheet__header u-container">
        <div class="step-label">Etapa 1/3</div>
      </header>

      <!-- SCROLL + BOX dos Termos -->
      <div class="sheet__scroll">
        <article id="termsBox" class="terms__box" tabindex="0" aria-label="Conteúdo dos termos"></article>
      </div>

      <!-- Footer centralizado (mesma largura do conteúdo) -->
      <footer class="sheet__footer u-container">
        <label class="agree">
          <input type="checkbox" id="chkAgree" />
          <span>Li e concordo com os termos (v<span id="termsVer">—</span>)</span>
        </label>

        <div class="actions">
          <button id="btnPrintTerms" class="btn link" type="button">Salvar PDF</button>
          <span class="spacer"></span>
          <button id="btnCancelTerms" class="btn ghost" type="button">Cancelar</button>
          <button id="btnAcceptTerms" class="btn primary" type="button" disabled>Aceitar e continuar</button>
        </div>
      </footer>
    </div>
  </section>

  <!-- ========== FOLHA: DADOS DA ORGANIZAÇÃO ========== -->
  <section id="orgFull" class="sheet sheet--org hide" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Dados da organização">
    <div class="sheet__inner">

      <header class="sheet__header">
        <div style="width:100%;max-width:980px;margin:0 auto;padding:0 var(--sheet-pad)">
          <div class="step-label">Etapa 2/3</div>
          <h2>Dados da organização</h2>
        </div>
      </header>

      <div class="sheet__scroll">
        <!-- A UI monta todo o formulário aqui -->
        <form id="orgForm" class="org-form" autocomplete="off"></form>

        <!-- (mantido como está; correção dessa folha faremos depois) -->
        <div class="sheet__footer">
          <div class="footer-notes">
            <div id="orgErrors" class="form-messages hide" aria-live="polite" role="status"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== FOLHA: DOCUMENTOS DA ORGANIZAÇÃO ========== -->
  <section id="docsFull" class="sheet sheet--docs hide" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Documentos da organização">
    <div class="sheet__inner">

      <!-- Header alinhado + rótulo de etapa -->
      <header class="sheet__header">
        <div style="width:100%;max-width:980px;margin:0 auto;padding:0 var(--sheet-pad)">
          <div class="step-label">Etapa 3/3</div>
          <h2>Documentos da organização</h2>
        </div>
      </header>

      <div class="sheet__scroll">
        <div class="u-mt-16">
          <p class="u-mb-8">
            Envie a documentação necessária para verificação do cadastro da sua empresa.
            <br><small class="help-note">Normalmente retornamos em até 3 dias úteis.
            Dúvidas? <a href="mailto:suporte@bidly.com">suporte@bidly.com</a></small>
          </p>

          <!-- Substituído dinamicamente pelo card do documento -->
          <div id="docsPlaceholder" class="u-mt-8 u-muted"></div>
        </div>
      </div>

      <footer class="sheet__footer">
        <div id="docsErrors" class="form-messages hide" aria-live="polite" role="status"></div>
        <div class="actions">
          <button id="btnDocsLater" class="btn ghost" type="button">Continuar depois</button>
          <span class="spacer"></span>
          <!-- fica oculto até a UI liberar via regra -->
          <button id="btnDocsNow" class="btn primary hide" type="button">Concluir agora</button>
        </div>
      </footer>
    </div>
  </section>

  <!-- ========== SCRIPTS ========== -->

  <!-- Supabase SDK + supa.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.js"></script>
  <script src="/assets/js/supa.js?v=AL2"></script>

  <!-- Utils -->
  <script src="/assets/js/utils/constants.js?v=AL2"></script>
  <script src="/assets/js/utils/dom.js?v=AL2"></script>
  <script src="/assets/js/utils/masks.js?v=AL2"></script>

  <!-- Repos necessários (NÃO carregar addresses.repo.js) -->
  <script src="/assets/js/repo/terms.repo.js?v=AL2"></script>
  <script src="/assets/js/repo/profiles.repo.js?v=AL2"></script>
  <script src="/assets/js/repo/documents.repo.js?v=AL2"></script>
  <script src="/assets/js/repo/progress.repo.js?v=AL2"></script>

  <!-- Services -->
  <script src="/assets/js/services/validation.service.js?v=AL2"></script>
  <script src="/assets/js/services/progress.service.js?v=PROG3"></script>
  <script src="/assets/js/services/documents.service.js?v=AL2"></script>
  <script src="/assets/js/services/profile.service.js?v=FINAL"></script>  <!-- PRECISA vir antes do app.js -->
  <!-- NÃO carregar org.service.js -->

  <!-- UI -->
  <script src="/assets/js/ui/terms.ui.js?v=AL2"></script>
  <script src="/assets/js/ui/org.ui.js?v=FINAL"></script>
  <script src="/assets/js/ui/docs.ui.js?v=AL3"></script>
  <script src="/assets/js/ui/support-notes.js?v=2"></script>

  <!-- Controllers -->
  <script src="/assets/js/activation.controller.js?v=FINAL"></script>

  <!-- (opcional) app.js por último, porém sem manipular #orgForm (ver passo 2) -->
  <script src="/assets/js/app.js?v=AL2"></script>

  <script>
    // Botão sair (topo) e identificação do usuário; usam supa.js
    (async () => {
      if (!window.connectSupabase || !window.applyAuthUI) return;
      const sb = await window.connectSupabase();
      await window.applyAuthUI();

      const out = document.getElementById('btnOutTop');
      out?.addEventListener('click', async () => {
        await window.logoutLocal?.();
        window.location.href = '/index.html';
      });

      // Mostra papel no topo, se disponível
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (user) {
          const { data } = await sb.from('profiles').select('role,email').eq('id', user.id).single();
          document.getElementById('userEmail').textContent = data?.email || user.email;
          document.getElementById('userRoleText').textContent = data?.role ? ` • Perfil: ${data.role === 'company' ? 'Empresa' : 'Fornecedor'}` : '';
        }
      } catch { /* ignore */ }
    })();
  </script>
</body>
</html>
